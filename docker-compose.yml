services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Generate a real one: openssl rand -base64 32
      AUTH_SECRET: "change-me-before-anything-public"
      AUTH_TRUST_HOST: "true"
    volumes:
      # Keeps admin uploads across container restarts.
      - uploads:/app/public/uploads

volumes:
  uploads:
