# FireOxine — three apps. Only `api` reaches the database.
#
# Every value comes from the environment, so the same file works locally and
# on a platform like Coolify, where the variables are set in the UI. Defaults
# after `:-` are development conveniences and are wrong for production.
#
# Ports are `expose`, not `ports`: a reverse proxy (Coolify's Traefik, or your
# own) routes to them by domain. Nothing is published on the host, so the back
# office cannot be reached by accident just because a port was open.
#
# First run, once the containers are up:
#
#   docker compose exec api npm run db:provision
#
# That migrates, downloads the 270 photographs onto the volume, and seeds. The
# order matters: the seed writes rows pointing at /uploads, so the files have
# to be there first.

services:
  api:
    build:
      context: .
      target: api
    expose:
      - "3002"
    environment:
      # The only service with database access.
      DATABASE_URL: ${DATABASE_URL}
      # Signs every session token. The API refuses to start without it.
      AUTH_SECRET: ${AUTH_SECRET}
    volumes:
      # Product photography and admin uploads. Without this, every redeploy
      # destroys every image the client has uploaded.
      - uploads:/app/apps/api/public/uploads
    networks:
      # Its own network, plus the shared one the managed database sits on.
      # Coolify puts a database resource on `coolify` and an application on a
      # network of its own, so without this second entry the API cannot reach
      # Postgres at all — and the symptom is a site that builds, deploys and
      # runs perfectly while showing an empty catalogue.
      #
      # Only the API needs it. The storefront and the back office reach the
      # database through the API and have no business on that network.
      - default
      - coolify
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
      args:
        # Baked into the HTML at BUILD time, so it must be present here and
        # not only in `environment`. Changing it needs a rebuild, not a restart.
        NEXT_PUBLIC_MEDIA_URL: ${NEXT_PUBLIC_MEDIA_URL}
    expose:
      - "3000"
    depends_on:
      - api
    environment:
      # Server-to-server, over the internal network. The browser never uses it.
      API_URL: ${API_URL:-http://api:3002}
      NEXT_PUBLIC_MEDIA_URL: ${NEXT_PUBLIC_MEDIA_URL}
    restart: unless-stopped

  admin:
    build:
      context: .
      target: admin
      args:
        NEXT_PUBLIC_MEDIA_URL: ${NEXT_PUBLIC_MEDIA_URL}
    expose:
      - "3001"
    depends_on:
      - api
    environment:
      API_URL: ${API_URL:-http://api:3002}
      NEXT_PUBLIC_MEDIA_URL: ${NEXT_PUBLIC_MEDIA_URL}
      # Only used for the "view on site" link out of the product editor.
      WEB_URL: ${WEB_URL}
    restart: unless-stopped

  # Local development only. Coolify supplies its own managed Postgres, so this
  # stays out of the way unless you ask for it:
  #   docker compose --profile local up
  postgres:
    profiles: ["local"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fireoxine
      POSTGRES_PASSWORD: fireoxine
      POSTGRES_DB: fireoxine
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fireoxine"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  # Coolify's shared network, created by Coolify itself. `external` means
  # "expected to exist already" — compose will not try to create it.
  coolify:
    external: true

volumes:
  uploads:
  pgdata:
